<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
  <title>Error flow</title>
  <rect width="760" height="430" rx="12" fill="#f6f8fa"/>
  <g font-family="Segoe UI, sans-serif" font-size="13">
    <rect x="280" y="16" width="200" height="32" rx="6" fill="#ffebe9" stroke="#ff8182"/>
    <text x="380" y="37" text-anchor="middle" fill="#d1242f">HTTP failure</text>
    <rect x="280" y="68" width="200" height="32" rx="6" fill="#fff1e5" stroke="#fb8f44"/>
    <text x="380" y="89" text-anchor="middle" fill="#bc4c00">HttpErrorParser</text>

    <rect x="24" y="140" width="220" height="32" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="134" y="161" text-anchor="middle" fill="#9a6700">SdkCanceledError → no callback</text>
    <rect x="24" y="184" width="220" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="134" y="205" text-anchor="middle" fill="#0969da">SdkTimeoutError</text>
    <rect x="24" y="228" width="220" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="134" y="249" text-anchor="middle" fill="#0969da">SdkNetworkError</text>
    <rect x="24" y="272" width="220" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="134" y="293" text-anchor="middle" fill="#0969da">SdkServerError</text>
    <rect x="24" y="316" width="220" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="134" y="337" text-anchor="middle" fill="#0969da">SdkForbiddenError</text>
    <rect x="24" y="360" width="250" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="149" y="381" text-anchor="middle" fill="#0969da" font-size="12">SdkNotFoundError / SdkRateLimitError</text>

    <rect x="300" y="228" width="160" height="32" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
    <text x="380" y="249" text-anchor="middle" fill="#0969da">SdkAuthError</text>
    <rect x="300" y="316" width="160" height="32" rx="6" fill="#fbefff" stroke="#c297ff"/>
    <text x="380" y="337" text-anchor="middle" fill="#8250df">SdkProjectError</text>

    <rect x="516" y="184" width="220" height="32" rx="6" fill="#fff1e5" stroke="#fb8f44"/>
    <text x="626" y="205" text-anchor="middle" fill="#bc4c00">invalidateSession</text>
    <rect x="516" y="250" width="220" height="32" rx="6" fill="#fbefff" stroke="#c297ff"/>
    <text x="626" y="271" text-anchor="middle" fill="#8250df">ApiErrorHandler</text>
    <rect x="516" y="316" width="220" height="32" rx="6" fill="#dafbe1" stroke="#4ac26b"/>
    <text x="626" y="337" text-anchor="middle" fill="#1a7f37">codeHandlers callback</text>
    <rect x="516" y="360" width="220" height="32" rx="6" fill="#fff8c5" stroke="#d4a72c"/>
    <text x="626" y="381" text-anchor="middle" fill="#9a6700">globalErrorMessage</text>

    <g fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#arrow)">
      <path d="M380 48 V68"/>
      <path d="M320 100 L134 140"/>
      <path d="M380 100 V184"/>
      <path d="M430 100 L380 228"/>
      <path d="M450 100 L380 316"/>
      <path d="M244 200 H516"/>
      <path d="M244 244 H516"/>
      <path d="M244 288 H516"/>
      <path d="M244 332 H516"/>
      <path d="M244 376 H516"/>
      <path d="M460 244 H516"/>
      <path d="M626 216 V250"/>
      <path d="M460 332 H516"/>
      <path d="M626 282 V316"/>
      <path d="M626 348 V360"/>
    </g>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8 5 L 0 8.8 z" fill="#656d76"/>
    </marker>
  </defs>
</svg>
