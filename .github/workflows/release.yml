name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

env:
  HUSKY: "0"

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run ci

      - name: Validate commits pushed to master
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "Initial push, skip range lint"
            exit 0
          fi
          npx commitlint --from "${{ github.event.before }}" --to "${{ github.sha }}" --verbose

  release:
    name: Semantic release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Require SemVer baseline tag
        run: |
          if ! git describe --tags --abbrev=0 --match 'v[0-9]*' >/dev/null 2>&1; then
            echo "::error::Create annotated tag v0.1.0 on the baseline commit before the first release. See docs/commits.md."
            exit 1
          fi

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release
